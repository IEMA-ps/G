<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>معاينة رفع شيت المنتجات</title><link rel="stylesheet" href="/brand.css"><link rel="stylesheet" href="/shared-catalog.css"><style>body{font-family:system-ui,sans-serif;margin:0;padding:14px}#modal{padding:14px;background:#fff;border:1px solid #ddd;border-radius:14px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}.btn{padding:11px 14px;border-radius:10px;border:1px solid #ccc;background:#fff;font-weight:700;margin:6px 0}.btn-primary{background:var(--teal,#c8421e);color:#fff;border:0}.modal-head{display:flex;justify-content:space-between}.modal-close{border:0;background:none;font-size:24px}</style><body><div id="modal"></div><div id="log"></div><script type="module">
import {installSheet} from './product-sheet-ui.js';
const S={role:'merchant',profile:{merchantId:'m1'},settings:{},plans:[],categories:[{id:'c1',name:'سوبر ماركت',isActive:true},{id:'c2',name:'مستلزمات منزلية',isActive:true},{id:'c3',name:'خضار وفاكهة',isActive:true}],myProducts:[]};
window.S=S;window.writes=[];
const UI={openModal:h=>{modal.innerHTML=h},closeModal:()=>{modal.innerHTML='<p>تم الحفظ</p>'},toast:m=>{log.textContent=m;window.lastToast=m}};
installSheet({S,db:{},doc:(d,c,id)=>c+'/'+id,writeBatch:()=>({ops:[],set(r,d){this.ops.push(['set',r,d])},update(r,d){this.ops.push(['update',r,d])},async commit(){window.writes.push(...this.ops);for(const[k,r,d]of this.ops){const id=r.split('/')[1];if(k==='set')S.myProducts.push(d);else Object.assign(S.myProducts.find(x=>x.id===id),d)}}}),UI,renderMain:()=>{},canEdit:()=>true});
ProductSheet.open();
</script></html>
