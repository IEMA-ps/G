<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة برنامج المسوقين</title><link rel="stylesheet" href="/brand.css"><style>body{background:#fff8ee;color:#30271e;font:16px Arial,sans-serif;margin:0;padding:18px}main{max-width:540px;margin:auto}.card{background:#fffdf8;border:1px solid #ecd9c6;border-radius:20px;padding:20px;margin:14px 0;line-height:1.75}.badge-chip{background:#fce9dd;border-radius:20px;padding:5px 10px;font-size:12px}h3{font-size:20px;margin:12px 0}p{font-size:14px}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #e4cebc;border-radius:10px;background:white;margin:8px 0;font:14px Arial}button{border:0;border-radius:12px;padding:13px;background:#cb3a19;color:white;font:bold 14px Arial;cursor:pointer;margin:5px 0;width:100%}button:disabled{background:#b9afa4}nav{display:grid;grid-template-columns:1fr 1fr;gap:6px}nav button{background:#796758;font-size:12px}progress{accent-color:#cb3a19;height:14px}small{display:block;color:#7f6656}#notice{padding:12px;border:1px dashed #bb704b;border-radius:12px;font-size:12px}</style></head><body><main><h2>برنامج المسوقين</h2><div id="notice">معاينة للمراجعة فقط ببيانات افتراضية. لا اتصال بقاعدة البيانات، لا تعيين أو صرف فعلي. التشغيل مقفول لحين نشر القواعد واعتماد النسخة.</div><nav><button onclick="show('locked')">الحافز المقفول</button><button onclick="show('achieved')">تحقق الهدف</button><button onclick="show('candidate')">رابط المرشح</button><button onclick="show('join')">طلب الانضمام</button><button onclick="show('admin')">تعيين واستثناء</button><button onclick="show('credit')">مراجعة الحافز</button></nav><div id="content"></div></main><script type="module">
import {incentiveCard,candidateCard,appointmentCard} from '/marketer-program.js?v=program-1';
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const start=Date.UTC(2026,10,24,7),period={id:'period_demo',startAt:start,endAt:start+7*86400000,target:5};const subs=Array.from({length:5},(_,i)=>({id:'sub'+i,merchantId:'shop'+i,marketerId:'demo',price:400,status:'APPROVED',approvedAt:start+i*1000,marketerBasePercent:10,marketerBaseAmount:40,marketerAmount:40}));const joins=Array.from({length:3},(_,i)=>({id:'person'+i,inviterId:'candidate_demo',emailVerified:true}));
window.Program={copyInvite:()=>alert('معاينة فقط، رابط افتراضي'),appoint:()=>alert('معاينة فقط، لا بيانات تكتب')};
window.show=kind=>{let html='';if(kind==='locked')html=incentiveCard(period,subs.slice(0,3),'demo',[],esc,start+86400000);if(kind==='achieved')html=incentiveCard(period,subs,'demo',[],esc,start+86400000);if(kind==='candidate')html=candidateCard('candidate_demo',joins,esc);if(kind==='join')html='<section class="card"><h3>تأكيد طلب الانضمام للتسويق</h3><p>دخلت عبر رابط ترشيح. سجل حسابك وأكد بريدك أولًا، ثم أكد رغبتك هنا.</p><p>طلب واحد لكل حساب، لا يمكن تغيير صاحب الدعوة بعد التأكيد. لا يحدث تعيين تلقائي.</p><label>حالة البريد</label><input readonly value="مؤكد ✓"><button onclick="alert(\'معاينة فقط، لم يسجل طلب\')">تأكيد طلب الانضمام للتسويق</button></section>';if(kind==='admin')html=appointmentCard({_id:'candidate_demo',firstName:'عضو مرشح'},joins,esc);if(kind==='credit')html=incentiveCard(period,subs,'demo',[],esc,period.endAt+1)+'<section class="card"><h3>مراجعة الأدمن الرئيسي</h3><p>عمولات الاشتراكات الأساسية:200ج.م</p><p>الإجمالي بعد ×1.5:300ج.م</p><b>فرق الحافز للإضافة:100ج.م</b><p>خمسة محلات مختلفة، دفع معتمد. لا زيادة فضي/ذهبي، لا رسوم طلبات. يسجل مرة واحدة بعد التحقق، ثم يدخل الرصيد. لا تحويل أموال تلقائي.</p><button onclick="alert(\'معاينة فقط، لا حافز يضاف\')">راجعت التحصيل، إضافة الحافز مرة واحدة</button></section>';document.getElementById('content').innerHTML=html;history.replaceState(null,'','#'+kind);};show(location.hash.slice(1)||'locked');window.__mapReady=true;
</script></body></html>
