<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>على بابك | اطلب اللي محتاجه</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#154C43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="على بابك">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --ink:#211E1A;
  --ink-soft:#6F6A61;
  --paper:#FBF7EF;
  --surface:#FFFFFF;
  --line:#E8E1D3;
  --teal:#154C43;
  --teal-deep:#0E362F;
  --teal-tint:#E4EEEB;
  --gold:#CF9A3E;
  --gold-tint:#FBF0DA;
  --danger:#B5453A;
  --danger-tint:#F8E9E7;
  --success:#2F7A52;
  --success-tint:#E5F2EA;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --shadow:0 1px 2px rgba(33,30,26,.06), 0 8px 24px -12px rgba(33,30,26,.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Cairo',sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
button{cursor:pointer;}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
::selection{background:var(--gold-tint);}

/* ---------- layout shell ---------- */
#appRoot{max-width:480px; margin:0 auto; min-height:100vh; background:var(--paper); position:relative; display:flex; flex-direction:column;}
.hidden{display:none !important;}

/* ---------- loading ---------- */
#loadingScreen{position:fixed; inset:0; background:var(--teal-deep); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:999;}
#loadingScreen .brand{font-size:30px; font-weight:800; color:#fff; letter-spacing:.5px;}
#loadingScreen .brand i{color:var(--gold); margin-inline-start:8px;}
.spinner{width:30px; height:30px; border:3px solid rgba(255,255,255,.25); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- auth screen ---------- */
#authScreen{min-height:100vh; display:flex; flex-direction:column; background:var(--teal-deep); color:#fff;}
.auth-hero{padding:56px 26px 30px; text-align:center;}
.auth-hero .logo{font-size:34px; font-weight:800;}
.auth-hero .logo i{color:var(--gold);}
.auth-hero p{color:#CBD8D3; margin-top:8px; font-size:14.5px;}
.auth-card{background:var(--paper); color:var(--ink); border-radius:26px 26px 0 0; padding:28px 22px 40px; flex:1; box-shadow:var(--shadow);}
.auth-tabs{display:flex; background:var(--teal-tint); border-radius:999px; padding:4px; margin-bottom:22px;}
.auth-tab{flex:1; text-align:center; padding:10px 0; border:none; background:transparent; border-radius:999px; font-weight:700; font-size:14px; color:var(--ink-soft); transition:.2s;}
.auth-tab.active{background:var(--teal); color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:var(--radius-m);
  background:var(--surface); outline:none; transition:.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);}
.field textarea{resize:vertical; min-height:70px;}
.role-picker{display:flex; gap:10px; margin-bottom:16px;}
.role-opt{flex:1; border:1.5px solid var(--line); border-radius:var(--radius-m); padding:14px 8px; text-align:center; background:var(--surface);}
.role-opt.active{border-color:var(--teal); background:var(--teal-tint);}
.role-opt i{font-size:20px; color:var(--teal); display:block; margin-bottom:6px;}
.role-opt span{font-size:12.5px; font-weight:700;}
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:14px; border:none; border-radius:var(--radius-m);
  font-weight:700; font-size:15px; transition:.15s;
}
.btn-primary{background:var(--teal); color:#fff;}
.btn-primary:active{background:var(--teal-deep);}
.btn-gold{background:var(--gold); color:#2A1D06;}
.btn-outline{background:transparent; border:1.5px solid var(--teal); color:var(--teal);}
.btn-ghost{background:var(--teal-tint); color:var(--teal);}
.btn-danger{background:var(--danger-tint); color:var(--danger);}
.btn-sm{padding:9px 12px; font-size:13px; border-radius:var(--radius-s);}
.btn:disabled{opacity:.55;}
.auth-switch{text-align:center; margin-top:18px; font-size:13.5px; color:var(--ink-soft);}
.auth-switch b{color:var(--teal); font-weight:700;}
.auth-error{background:var(--danger-tint); color:var(--danger); padding:10px 12px; border-radius:var(--radius-s); font-size:13px; margin-bottom:14px;}
.hint-box{background:var(--gold-tint); border:1px dashed var(--gold); border-radius:var(--radius-m); padding:12px 14px; font-size:12.5px; color:#5C4315; margin-top:16px; line-height:1.7;}
.star-picker{display:flex; gap:6px; font-size:24px;}
.star-picker i{color:var(--line); cursor:pointer; transition:.1s;}
.star-picker i:active{transform:scale(1.15);}

/* ---------- app shell ---------- */
#appShell{display:flex; flex-direction:column; min-height:100vh;}
#topbar{
  position:sticky; top:0; z-index:20; background:var(--teal); color:#fff;
  padding:14px 16px; display:flex; align-items:center; gap:10px;
}
#topbar .tb-title{font-weight:800; font-size:17px; flex:1;}
#topbar .tb-title small{display:block; font-size:11px; font-weight:500; color:#CBD8D3;}
.icon-btn{width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,255,255,.14); color:#fff; display:flex; align-items:center; justify-content:center; position:relative; font-size:15px;}
.icon-btn .dot{position:absolute; top:5px; left:7px; width:9px; height:9px; background:var(--gold); border-radius:50%; border:2px solid var(--teal);}
#searchBar{padding:12px 16px 4px; background:var(--teal);}
#searchBar .box{background:#fff; border-radius:999px; display:flex; align-items:center; gap:8px; padding:10px 14px;}
#searchBar input{border:none; outline:none; flex:1; background:transparent;}
#searchBar i{color:var(--ink-soft);}

#mainContent{flex:1; padding:16px 16px 90px;}
#bottomNav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  background:#fff; border-top:1px solid var(--line); display:flex; z-index:20;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; border:none; background:transparent; color:var(--ink-soft); font-size:10.5px; font-weight:700;}
.nav-btn i{font-size:18px;}
.nav-btn.active{color:var(--teal);}
.nav-btn .badge{position:absolute; margin-top:-14px; margin-right:-4px; background:var(--danger); color:#fff; font-size:9px; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;}

/* ---------- section title ---------- */
.section-head{display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px;}
.section-head h3{font-size:16px; font-weight:800; margin:0;}
.section-head .more{font-size:12.5px; color:var(--teal); font-weight:700;}
.section-head:first-child{margin-top:0;}

/* ---------- banners ---------- */
.banner-strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;}
.banner-strip::-webkit-scrollbar{display:none;}
.banner{min-width:270px; border-radius:var(--radius-l); background:linear-gradient(135deg,var(--teal),#1F6356); color:#fff; padding:20px; position:relative; overflow:hidden;}
.banner h4{margin:0 0 4px; font-size:16px; font-weight:800;}
.banner p{margin:0; font-size:12.5px; color:#D6E5E0;}
.banner i{position:absolute; font-size:60px; opacity:.15; left:-6px; bottom:-10px;}

/* ---------- categories ---------- */
.cat-scroll{display:flex; gap:10px; overflow-x:auto; scrollbar-width:none;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-chip{min-width:74px; display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px 8px;}
.cat-chip .em{font-size:22px;}
.cat-chip span{font-size:11px; font-weight:700; text-align:center; line-height:1.3;}
.cat-chip.active{background:var(--teal-tint); border-color:var(--teal);}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px;}
.list-gap{display:flex; flex-direction:column; gap:12px;}

.merchant-card{display:flex; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px; align-items:center;}
.merchant-card .logo{width:56px; height:56px; border-radius:var(--radius-s); background:var(--teal-tint); display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--teal); flex-shrink:0; overflow:hidden;}
.merchant-card .logo img{width:100%; height:100%; object-fit:cover;}
.merchant-card .info{flex:1; min-width:0;}
.merchant-card .info h4{margin:0 0 3px; font-size:14.5px; font-weight:800;}
.merchant-card .info .meta{font-size:12px; color:var(--ink-soft); display:flex; gap:8px; align-items:center;}
.status-pill{font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px;}
.status-pending{background:var(--gold-tint); color:#8A5B00;}
.status-active{background:var(--success-tint); color:var(--success);}
.status-suspended{background:var(--danger-tint); color:var(--danger);}

.product-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.product-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; position:relative;}
.product-card .thumb{aspect-ratio:1.15; background:var(--teal-tint) center/cover no-repeat; position:relative;}
.product-card .disc{position:absolute; top:8px; right:8px; background:var(--danger); color:#fff; font-size:10.5px; font-weight:800; padding:3px 7px; border-radius:6px;}
.product-card .body{padding:10px;}
.product-card h5{margin:0 0 4px; font-size:13px; font-weight:700; line-height:1.35; min-height:35px;}
.product-card .price-row{display:flex; align-items:baseline; gap:6px; margin-bottom:8px;}
.product-card .price{font-weight:800; color:var(--teal); font-size:14.5px;}
.product-card .old-price{font-size:11.5px; color:var(--ink-soft); text-decoration:line-through;}
.product-card .add-btn{width:100%; background:var(--teal); color:#fff; border:none; border-radius:var(--radius-s); padding:8px; font-weight:700; font-size:12.5px;}
.product-card .stockout{background:var(--line); color:var(--ink-soft);}
.qty-stepper{display:flex; align-items:center; justify-content:space-between; background:var(--teal); border-radius:var(--radius-s); overflow:hidden;}
.qty-stepper button{background:transparent; border:none; color:#fff; width:30px; height:32px; font-weight:800;}
.qty-stepper span{color:#fff; font-weight:800; font-size:13px;}

/* ---------- empty state ---------- */
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty-state i{font-size:38px; color:var(--line); margin-bottom:12px; display:block;}
.empty-state h4{color:var(--ink); font-size:15px; margin:0 0 6px;}
.empty-state p{font-size:13px; margin:0;}

/* ---------- cart ---------- */
.cart-line{display:flex; gap:10px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
.cart-line:last-child{border-bottom:none;}
.cart-line .thumb{width:54px; height:54px; border-radius:var(--radius-s); background:var(--teal-tint) center/cover no-repeat; flex-shrink:0;}
.cart-line .info{flex:1; min-width:0;}
.cart-line .info h5{margin:0 0 3px; font-size:13.5px; font-weight:700;}
.cart-line .info .m{font-size:11px; color:var(--ink-soft);}
.summary-row{display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; color:var(--ink-soft);}
.summary-row.total{color:var(--ink); font-weight:800; font-size:16px; border-top:1px dashed var(--line); margin-top:6px; padding-top:12px;}

/* ---------- order ---------- */
.order-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px;}
.order-card .top-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.order-card .oid{font-weight:800; font-size:13.5px;}
.order-card .date{font-size:11.5px; color:var(--ink-soft);}
.timeline{display:flex; align-items:center; margin:14px 0 4px;}
.timeline .step{flex:1; display:flex; flex-direction:column; align-items:center; position:relative;}
.timeline .step .dot{width:20px; height:20px; border-radius:50%; background:var(--line); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; z-index:1;}
.timeline .step.done .dot{background:var(--teal);}
.timeline .step .lbl{font-size:9.5px; color:var(--ink-soft); margin-top:5px; text-align:center;}
.timeline .step:not(:last-child)::after{content:''; position:absolute; top:9px; right:calc(50% + 12px); left:calc(-50% + 12px); height:2px; background:var(--line);}
.timeline .step.done:not(:last-child)::after{background:var(--teal);}

/* ---------- misc ---------- */
.badge-chip{display:inline-flex; align-items:center; gap:5px; background:var(--teal-tint); color:var(--teal); font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;}
.divider{height:1px; background:var(--line); margin:16px 0;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px;}
.stat-card .num{font-size:22px; font-weight:800; color:var(--teal);}
.stat-card .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.seg{display:flex; background:var(--teal-tint); border-radius:999px; padding:3px; overflow-x:auto; scrollbar-width:none; gap:2px;}
.seg::-webkit-scrollbar{display:none;}
.seg button{white-space:nowrap; border:none; background:transparent; padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--teal);}
.seg button.active{background:var(--teal); color:#fff;}
.row-between{display:flex; align-items:center; justify-content:space-between;}
.fab{position:fixed; bottom:78px; left:50%; transform:translateX(-146px); background:var(--gold); color:#2A1D06; width:52px; height:52px; border-radius:50%; border:none; box-shadow:var(--shadow); font-size:19px; z-index:19;}

/* ---------- modal ---------- */
#modalRoot{position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center;}
#modalRoot.hidden{display:none;}
.modal-backdrop{position:absolute; inset:0; background:rgba(15,20,18,.5);}
.modal-sheet{position:relative; width:100%; max-width:480px; background:var(--paper); border-radius:24px 24px 0 0; max-height:88vh; overflow-y:auto; padding:20px 18px calc(24px + env(safe-area-inset-bottom));}
.modal-sheet .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-sheet .modal-head h3{margin:0; font-size:17px; font-weight:800;}
.modal-close{width:32px; height:32px; border-radius:50%; background:var(--teal-tint); border:none; color:var(--teal);}

/* ---------- toast ---------- */
#toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:13px; font-weight:600; z-index:80; opacity:0; transition:.25s; pointer-events:none; white-space:nowrap; max-width:90%; overflow:hidden; text-overflow:ellipsis;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (min-width:481px){
  body{background:#EDE7DA;}
  #appRoot{box-shadow:0 0 40px rgba(0,0,0,.1); min-height:100vh;}
  #bottomNav{position:sticky;}
}
</style>
</head>
<body>

<div id="appRoot">

  <div id="loadingScreen">
    <div class="brand"><i class="fa-solid fa-store"></i> على بابك</div>
    <div class="spinner"></div>
  </div>

  <div id="authScreen" class="hidden">
    <div class="auth-hero">
      <div class="logo"><i class="fa-solid fa-store"></i> على بابك</div>
      <p>اطلب اللي محتاجه… وإحنا نوصلّه لحد بابك</p>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="Auth.switchTab('login')">تسجيل الدخول</button>
        <button class="auth-tab" id="tabRegister" onclick="Auth.switchTab('register')">حساب جديد</button>
      </div>
      <div id="authError" class="auth-error hidden"></div>

      <form id="loginForm" onsubmit="Auth.login(event)">
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" required placeholder="example@mail.com"></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="loginPassword" required placeholder="••••••••"></div>
        <button class="btn btn-primary" type="submit" id="loginBtn"><i class="fa-solid fa-arrow-left"></i> دخول</button>
      </form>

      <form id="registerForm" class="hidden" onsubmit="Auth.register(event)">
        <div class="role-picker">
          <div class="role-opt active" data-role="customer" onclick="Auth.pickRole('customer')"><i class="fa-solid fa-user"></i><span>عميل</span></div>
          <div class="role-opt" data-role="merchant" onclick="Auth.pickRole('merchant')"><i class="fa-solid fa-shop"></i><span>صاحب متجر</span></div>
        </div>
        <div class="field"><label>الاسم الأول</label><input type="text" id="regFirst" required></div>
        <div class="field"><label>الاسم الأخير</label><input type="text" id="regLast"></div>
        <div class="field"><label>رقم الهاتف</label><input type="tel" id="regPhone" required placeholder="01xxxxxxxxx"></div>
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="regEmail" required></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="regPassword" required minlength="6" placeholder="6 أحرف على الأقل"></div>
        <div class="field"><label>كود دعوة صديق (اختياري)</label><input type="text" id="regReferral" placeholder="لو صاحبك دعاك، اكتب كوده هنا" style="text-transform:uppercase"></div>

        <div id="merchantFields" class="hidden">
          <div class="divider"></div>
          <div class="field"><label>اسم المتجر</label><input type="text" id="mBusinessName"></div>
          <div class="field"><label>نوع النشاط</label>
            <select id="mActivityType">
              <option value="مطاعم">مطاعم ومأكولات</option>
              <option value="سوبر ماركت">سوبر ماركت ومؤن</option>
              <option value="حلويات">حلويات ومخبوزات</option>
              <option value="إلكترونيات">إلكترونيات وأجهزة</option>
              <option value="صيدلية">صيدلية وعناية</option>
              <option value="ملابس">ملابس وأزياء</option>
            </select>
          </div>
          <div class="field"><label>رقم واتساب المتجر</label><input type="tel" id="mWhatsapp" placeholder="01xxxxxxxxx"></div>
          <div class="field"><label>عنوان المتجر</label><input type="text" id="mAddress"></div>
          <div class="field"><label>نبذة عن المتجر</label><textarea id="mDescription"></textarea></div>
        </div>

        <button class="btn btn-primary" type="submit" id="registerBtn"><i class="fa-solid fa-user-plus"></i> إنشاء الحساب</button>
        <div class="hint-box" id="merchantHint" style="display:none">
          <i class="fa-solid fa-circle-info"></i> بعد التسجيل هيتحول طلبك لفريق الإدارة للمراجعة والموافقة قبل ما متجرك يظهر للعملاء.
        </div>
      </form>

      <div class="auth-switch">
        على بابك — اطلب اللي محتاجه، وإحنا نوصلّه لحد بابك
      </div>
    </div>
  </div>

  <div id="appShell" class="hidden">
    <div id="topbar"></div>
    <div id="searchBar" class="hidden"></div>
    <div id="mainContent"></div>
    <div id="bottomNav"></div>
  </div>

  <div id="modalRoot" class="hidden">
    <div class="modal-backdrop" onclick="UI.closeModal()"></div>
    <div class="modal-sheet" id="modalSheet"></div>
  </div>

  <div id="toast"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc,
  collection, query, where, orderBy, onSnapshot, serverTimestamp,
  writeBatch, increment, limit
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

/* ---- حساب الأسبوع المحاسبي (يبدأ السبت وينتهي الجمعة) لتجميع مستحقات كل تاجر ---- */
function weekStartOf(ts){
  const d = new Date(ts);
  const day = d.getDay(); // 0=أحد ... 6=سبت
  const diffToSaturday = (day + 1) % 7;
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diffToSaturday);
  start.setHours(0,0,0,0);
  return start.getTime();
}
function weekKeyOf(ts){
  const d = new Date(weekStartOf(ts));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function weekLabelOf(wk){
  const start = new Date(wk+'T00:00:00').getTime();
  const end = start + 6*86400000;
  const fmt = ts => new Date(ts).toLocaleDateString('ar-EG',{day:'numeric',month:'short'});
  return fmt(start) + ' → ' + fmt(end);
}
function roundMoney(n){ return Math.round((n||0)*100)/100; }
/* ---- هل المتجر مفتوح الآن؟ بناءً على ساعات العمل المحددة من التاجر (openTime/closeTime بصيغة HH:MM) ---- */
function isMerchantOpenNow(m){
  if(!m || !m.openTime || !m.closeTime) return true; // لو التاجر ماحددش ساعات عمل، اعتبره متاح دايمًا
  const now = new Date();
  const [oh,om] = m.openTime.split(':').map(Number);
  const [ch,cm] = m.closeTime.split(':').map(Number);
  const nowMins = now.getHours()*60 + now.getMinutes();
  const openMins = oh*60+om, closeMins = ch*60+cm;
  if(openMins===closeMins) return true; // نفس الوقت = مفتوح 24 ساعة
  if(openMins < closeMins) return nowMins>=openMins && nowMins<closeMins;
  return nowMins>=openMins || nowMins<closeMins; // فترة عمل بتمتد لليوم التالي، زي 10 مساءً → 2 فجرًا
}

/* يحسب حالة الطلب الرئيسي تلقائيًا من حالات كل SubOrders التابعة له.
   القاعدة: الطلب يوصل لأي خطوة لما كل الأجزاء النشطة (غير المرفوضة) توصل لنفس الخطوة على الأقل،
   وبالتالي بيتقدم صح خطوة خطوة لحد "تم التسليم"، وبيتحول لـ"ملغي" لو كل الأجزاء اتلغت/اترفضت. */
const ORDER_STEP_SEQUENCE = ['PENDING_ADMIN','SENT_TO_MERCHANT','ACCEPTED','PREPARING','OUT_FOR_DELIVERY','DELIVERED'];
async function recomputeOrderStatus(orderId){
  try{
    const snap = await getDocs(query(collection(db,'subOrders'), where('parentOrderId','==',orderId)));
    const subs = snap.docs.map(d=>d.data());
    if(!subs.length) return;
    const isTerminalBad = s => s.status==='REJECTED' || s.status==='CANCELLED';
    const active = subs.filter(s=>!isTerminalBad(s));
    let status;
    if(!active.length){
      status = 'CANCELLED';
    } else {
      const indices = active.map(s=>ORDER_STEP_SEQUENCE.indexOf(s.status)).filter(i=>i>=0);
      const minIdx = indices.length ? Math.min(...indices) : 0;
      status = ORDER_STEP_SEQUENCE[minIdx];
    }
    await updateDoc(doc(db,'orders',orderId), {status});
  }catch(e){ console.error('recomputeOrderStatus failed', e); }
}

function sortProducts(list, sortKey){
  const arr = [...list];
  if(sortKey==='PRICE_ASC') arr.sort((a,b)=>a.price-b.price);
  else if(sortKey==='PRICE_DESC') arr.sort((a,b)=>b.price-a.price);
  else if(sortKey==='NEWEST') arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return arr;
}

/* ================= TOAST / MODAL ================= */
const UI = {
  toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2400);
  },
  openModal(html){
    document.getElementById('modalSheet').innerHTML = html;
    document.getElementById('modalRoot').classList.remove('hidden');
    // نضيف خطوة في تاريخ المتصفح عشان زرار الرجوع في الموبايل يقفل المودال بدل ما يقفل الصفحة أو يغيّر التاب
    try{ history.pushState({modal:true}, ''); }catch(e){}
  },
  closeModal(){
    // لو المودال ده اللي فاتح آخر خطوة في التاريخ، نرجع خطوة (history.back) بدل ما نقفله يدوي،
    // عشان تاريخ المتصفح يفضل متزامن مع اللي العميل شايفه فعليًا
    if(history.state && history.state.modal){
      history.back();
    } else {
      document.getElementById('modalRoot').classList.add('hidden');
      document.getElementById('modalSheet').innerHTML='';
    }
  }
};

          logoUrl:'', coverUrl:'', status:'PENDING', rating:4.8, totalOrdersCount:0,
          ownerId: cred.user.uid, registeredAt: nowMs()
        });
      }
      await setDoc(doc(db,'users',cred.user.uid), {
        id: cred.user.uid, firstName:first, lastName:last, phone, email,
        role: Auth.role === 'merchant' ? 'MERCHANT' : 'CUSTOMER',
        merchantId, loyaltyPoints:0, referralCode: cred.user.uid.slice(-6).toUpperCase(), createdAt: nowMs()
      });

      // معالجة كود دعوة الصديق لو العميل الجديد دخل واحد
      const referralInput = document.getElementById('regReferral').value.trim().toUpperCase();
      if(referralInput){
        try{
          const q = await getDocs(query(collection(db,'users'), where('referralCode','==',referralInput)));
          if(!q.empty){
            const referrerDoc = q.docs[0];
            if(referrerDoc.id !== cred.user.uid){
              await updateDoc(doc(db,'users',cred.user.uid), { referredBy: referrerDoc.id });
              await setDoc(doc(db,'referrals', cred.user.uid), {
                refereeId: cred.user.uid, referrerId: referrerDoc.id, status:'PENDING', createdAt: nowMs()
              });
            }
          }
        }catch(e){ console.error('referral code lookup failed', e); }
      }

      UI.toast(Auth.role==='merchant' ? 'تم إرسال طلبك، بانتظار موافقة الإدارة ✅' : 'تم إنشاء حسابك بنجاح 🎉');
    }catch(err){
      Auth.showError(Auth.friendlyError(err));
    } finally{ btn.disabled = false; }
  },
  friendlyError(err){
    const c = err.code || '';
    if(c.includes('email-already-in-use')) return 'البريد الإلكتروني مستخدم بالفعل';
    if(c.includes('invalid-email')) return 'صيغة البريد الإلكتروني غير صحيحة';
    if(c.includes('weak-password')) return 'كلمة المرور ضعيفة، استخدم 6 أحرف على الأقل';
    if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
    if(c.includes('too-many-requests')) return 'محاولات كثيرة، حاول بعد قليل';
    return 'حدث خطأ، حاول مرة أخرى';
  },
  logout(){ signOut(auth); }
};

  S.unsubs.push(onSnapshot(collection(db,'settlements'), snap=>{ S.allSettlements = snap.docs.map(d=>({...d.data(),_id:d.id})); render(); }));

const getMerchant = id => S.merchants.find(m=>m.id===id) || S.allMerchants.find(m=>m.id===id);
const getProduct = id => S.products.find(p=>p.id===id);
const getCategory = id => S.categories.find(c=>c.id===id);
function activeProducts(){ return S.products.filter(p=>p.isActive && getMerchant(p.merchantId)); }
function cartLines(){ return S.cart.map(c=>({...c, product:getProduct(c.productId)})).filter(l=>l.product); }
function cartTotal(){ return cartLines().reduce((a,l)=>a+l.product.price*l.quantity,0); }
function cartMerchantCount(){ return new Set(cartLines().map(l=>l.product.merchantId)).size; }

window.addToCart = (pid, qty=1)=>{
  const p = getProduct(pid);
  const ex = S.cart.find(c=>c.productId===pid);
  const desired = (ex?ex.quantity:0) + qty;
  if(p && p.stock!=null && desired>p.stock){
    if(p.stock<=0){ UI.toast('هذا المنتج نفذ من المخزون حاليًا'); return; }
    if(ex) ex.quantity = p.stock; else S.cart.push({productId:pid, quantity:p.stock});
    saveCart(); UI.toast(`تم إضافة أقصى كمية متاحة (${p.stock})`); renderMain(); renderShell();
    return;
  }
  if(ex) ex.quantity = desired; else S.cart.push({productId:pid, quantity:qty});
  saveCart(); UI.toast('تمت الإضافة إلى السلة 🛒'); renderMain(); renderShell();
};
window.setCartQty = (pid, qty)=>{
  const p = getProduct(pid);
  if(qty<=0){ S.cart = S.cart.filter(c=>c.productId!==pid); }
  else {
    if(p && p.stock!=null && qty>p.stock){ UI.toast(`متوفر ${p.stock} فقط من هذا المنتج`); qty = p.stock; }
    if(qty<=0){ S.cart = S.cart.filter(c=>c.productId!==pid); }
    else { const ex = S.cart.find(c=>c.productId===pid); if(ex) ex.quantity=qty; }
  }
  saveCart(); renderMain(); renderShell();
};
window.clearCart = ()=>{ S.cart=[]; saveCart(); renderMain(); renderShell(); };

function qtyInCart(pid){ const c = S.cart.find(c=>c.productId===pid); return c?c.quantity:0; }

function productCard(p){
  const disc = p.discountPercent>0 ? `<div class="disc">خصم ${p.discountPercent}%</div>` : '';
  const qty = qtyInCart(p.id);
  const liked = isWishlisted(p.id);
  const btn = !p.isActive || p.stock<=0
    ? `<button class="add-btn stockout" disabled>غير متوفر</button>`
    : qty>0
      ? `<div class="qty-stepper"><button onclick="setCartQty('${p.id}',${qty-1})">−</button><span>${qty}</span><button onclick="setCartQty('${p.id}',${qty+1})">+</button></div>`
      : `<button class="add-btn" onclick="addToCart('${p.id}')"><i class="fa-solid fa-cart-plus"></i> أضف للسلة</button>`;
  return `<div class="product-card">
    <div class="thumb" style="background-image:url('${esc(p.imageUrl||'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500')}');position:relative" onclick="openProduct('${p.id}')">

      <button onclick="event.stopPropagation();toggleWishlist('${p.id}')" style="position:absolute;top:8px;left:8px;width:30px;height:30px;border:none;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:${liked?'var(--danger)':'#999'}"><i class="fa-solid fa-heart"></i></button>
    </div>
    <div class="body">
      <h5 onclick="openProduct('${p.id}')">${esc(p.title)}</h5>
      <div class="price-row"><span class="price">${fmtMoney(p.price)}</span>${p.oldPrice?`<span class="old-price">${fmtMoney(p.oldPrice)}</span>`:''}</div>
      ${btn}
    </div></div>`;
}

window.applyLoyaltyPoints = ()=>{
  const available = (S.profile && S.profile.loyaltyPoints) || 0;
  const rate = S.settings.loyaltyRedeemValue || 0;
  if(!available || !rate){ UI.toast('لا يوجد رصيد نقاط كافٍ'); return; }
  const groups = {}; cartLines().forEach(l=>{ (groups[l.product.merchantId]=groups[l.product.merchantId]||[]).push(l); });
  const fee = S.settings.defaultDeliveryFee * Object.keys(groups).length;
  const couponDiscount = S.appliedCoupon ? S.appliedCoupon.discount : 0;
  const remaining = Math.max(0, cartTotal()+fee-couponDiscount);
  const maxUsablePoints = Math.min(available, Math.floor(remaining/rate));
  if(maxUsablePoints<=0){ UI.toast('لا يمكن استخدام النقاط على هذا الطلب حاليًا'); return; }
  const discount = roundMoney(maxUsablePoints*rate);
  S.appliedPoints = { points:maxUsablePoints, discount };
  UI.toast(`تم استخدام ${maxUsablePoints} نقطة (خصم ${fmtMoney(discount)}) 🎁`);
  renderMain();
};
window.removeLoyaltyPoints = ()=>{ S.appliedPoints = null; renderMain(); };
window.applyCoupon = async ()=>{
  const codeInput = document.getElementById('couponInput');
  const code = codeInput.value.trim().toUpperCase();
  if(!code){ UI.toast('اكتب كود الكوبون أولاً'); return; }
  try{
    const snap = await getDoc(doc(db,'coupons', code));
    if(!snap.exists()){ UI.toast('كود الكوبون غير صحيح'); return; }
    const c = snap.data();
    if(!c.isActive){ UI.toast('هذا الكوبون متوقف حاليًا'); return; }
    if(c.expiresAt && c.expiresAt < nowMs()){ UI.toast('انتهت صلاحية هذا الكوبون'); return; }
    if(c.maxUses && (c.usedCount||0) >= c.maxUses){ UI.toast('تم استنفاد عدد مرات استخدام هذا الكوبون'); return; }
    const subtotal = cartTotal();
    if(c.minOrderAmount && subtotal < c.minOrderAmount){ UI.toast(`هذا الكوبون يتطلب حد أدنى ${fmtMoney(c.minOrderAmount)} للسلة`); return; }
    const discount = c.type==='PERCENT' ? roundMoney(subtotal*c.value/100) : Math.min(c.value, subtotal);
    S.appliedCoupon = { code, discount };
    UI.toast('تم تطبيق الكوبون بنجاح 🎉');
    renderMain();
  }catch(err){
    console.error('applyCoupon failed', err);
    UI.toast('حصل خطأ أثناء التحقق من الكوبون');
  }
};

window.submitOrder = async ()=>{
  const btn = document.querySelector('#mainContent button[onclick="submitOrder()"]');
  if(btn){ if(btn.disabled) return; btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إنشاء الطلب...'; }
  try{
    const picked = document.querySelector('input[name=addrPick]:checked');
    if(!picked){ UI.toast('اختر عنوان التوصيل أولاً'); return; }
    const address = S.myAddresses.find(a=>a._id===picked.value);
    const lines = cartLines();
    if(!lines.length) return;
    // التجميع حسب التاجر داخليًا فقط، لتقسيم SubOrders — لا يظهر هذا التجميع للعميل
    const groups = {}; lines.forEach(l=>{ (groups[l.product.merchantId]=groups[l.product.merchantId]||[]).push(l); });
    // تحقّق دفاعي من الحد الأدنى للطلب لكل تاجر (بالإضافة للتحقق الظاهر في شاشة الدفع)
    for(const [mid, items] of Object.entries(groups)){
      const m = getMerchant(mid);
      const subtotal = items.reduce((a,l)=>a+l.product.price*l.quantity,0);
      if(m && m.minOrderAmount && subtotal < m.minOrderAmount){
        UI.toast(`الحد الأدنى للطلب من ${m.businessName} هو ${fmtMoney(m.minOrderAmount)}`);
        return;
      }
    }
    const notes = document.getElementById('orderNotes').value.trim();
    const fee = S.settings.defaultDeliveryFee * Object.keys(groups).length;
    const coupon = S.appliedCoupon;
    const couponDiscount = coupon ? coupon.discount : 0;
    const pts = S.appliedPoints;
    const pointsDiscount = pts ? pts.discount : 0;
    const totalDiscount = couponDiscount + pointsDiscount;
    const orderId = 'ORD-' + Math.floor(10000+Math.random()*89999);
    // نحسب subIds مقدّمًا قبل أي كتابة، عشان نكتب المستند مرة واحدة فقط
    // (Firestore بيرفض batch فيه set() و update() على نفس المستند في نفس الوقت)
    const subIds = Object.keys(groups).map((mid, idx)=>`SUB-${orderId}-${idx+1}`);
    const batch = writeBatch(db);
    batch.set(doc(db,'orders',orderId), {
      id:orderId, customerId:S.user.uid, customerName:(S.profile.firstName+' '+S.profile.lastName).trim(),
      customerPhone:S.profile.phone, deliveryAddress:address.fullAddressText, notes,
      subtotal:cartTotal(), deliveryFee:fee, discount:totalDiscount, couponCode: coupon?coupon.code:null, couponDiscount,
      pointsRedeemed: pts?pts.points:0, pointsDiscount, total:Math.max(0, cartTotal()+fee-totalDiscount),
      status:'PENDING_ADMIN', paymentMethod:'الدفع نقدًا عند الاستلام (COD)', merchantCount:Object.keys(groups).length,
      subOrderIds: subIds, createdAt: nowMs()
    });
    // ملاحظة: الخصم (كوبون أو نقاط) بيتحمّله المنصة على مستوى الطلب فقط — subtotal كل SubOrder (المستخدم في حساب مستحقات التاجر) بيفضل كامل بدون تأثر
    Object.entries(groups).forEach(([mid, items], idx)=>{
      const m = getMerchant(mid);
      const subId = subIds[idx];
      batch.set(doc(db,'subOrders',subId), {
        id:subId, parentOrderId:orderId, merchantId:mid, merchantName:m?m.businessName:'', merchantWhatsapp:m?m.whatsappNumber:'',
        subtotal: items.reduce((a,l)=>a+l.product.price*l.quantity,0),
        status:'PENDING_ADMIN', merchantContactStatus:null, merchantContactedAt:null, sentByAdminId:null,
        customerId:S.user.uid,
        customerName:(S.profile.firstName+' '+S.profile.lastName).trim(), customerPhone:S.profile.phone,
        deliveryAddress:address.fullAddressText, notes, createdAt: nowMs(),
        items: items.map(l=>({productId:l.productId, productTitle:l.product.title, price:l.product.price, quantity:l.quantity}))
      });
      // خصم الكمية المطلوبة من مخزون كل منتج فور تأكيد الطلب
      items.forEach(l=>{ batch.update(doc(db,'products', l.productId), { stock: increment(-l.quantity) }); });
    });
    if(coupon){ batch.update(doc(db,'coupons', coupon.code), { usedCount: increment(1) }); }
    if(pts && pts.points>0){ batch.update(doc(db,'users', S.user.uid), { loyaltyPoints: increment(-pts.points) }); }
    await batch.commit();
    S.appliedCoupon = null;
    S.appliedPoints = null;
    // تنبيه التاجر لو مخزون أي منتج قرب يخلص أو خلص فعلاً بعد خصم هذا الطلب
    for(const l of lines){
      const newStock = (l.product.stock||0) - l.quantity;
      if(newStock<=0){
        await pushNotification('MERCHANT', l.product.merchantId, 'المنتج نفذ من المخزون ⚠️', `منتج "${l.product.title}" نفذ من المخزون تمامًا، حدّث الكمية أو أوقف تفعيله.`, l.productId);
      } else if(newStock<=5){
        await pushNotification('MERCHANT', l.product.merchantId, 'مخزون منخفض ⚠️', `منتج "${l.product.title}" باقي منه ${newStock} قطع بس، وقتها تجهّز كمية جديدة.`, l.productId);
      }
    }
    // ❌ ممنوع تمامًا: لا يصل أي إشعار للتاجر عند إنشاء الطلب.
    // ✅ إشعار الأدمن فقط، ليراجع الطلب ويرسله للتاجر المناسب يدويًا.
    await pushNotification('ADMIN', 'ALL', 'طلب جديد 🔔', `تم استلام طلب جديد من ${(S.profile.firstName+' '+S.profile.lastName).trim()} برقم #${orderId}، في انتظار المراجعة والإرسال للتاجر.`, orderId);
    window.clearCart();
    S.lastOrderId = orderId;
    UI.toast('تم تأكيد طلبك بنجاح 🎉');
    go('orders');
  } catch(err){
    console.error('submitOrder failed', err);
    UI.toast('حصل خطأ أثناء إنشاء الطلب: ' + (err && err.message ? err.message : err));
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check"></i> تأكيد الطلب (الدفع عند الاستلام)'; }
  }
};

window.submitOrderRating = async (subId)=>{
  const s = S.mySubOrders.find(x=>(x._id||x.id)===subId);
  if(!s) return;
  const merchantEl = document.getElementById('starMerchant');
  const merchantRating = parseInt((merchantEl&&merchantEl.dataset.value)||'0');
  if(!merchantRating){ UI.toast('قيّم المتجر على الأقل قبل الإرسال'); return; }
  const agentEl = document.getElementById('starAgent');
  const agentRating = agentEl ? parseInt(agentEl.dataset.value||'0') : 0;
  const comment = document.getElementById('rateComment').value.trim();
  const productRatings = (s.items||[]).map((it,i)=>{
    const el = document.getElementById('starProd'+i);
    const v = el ? parseInt(el.dataset.value||'0') : 0;
    return {productId: it.productId, rating: v};
  }).filter(r=>r.rating>0);

  const rateId = 'rate_'+subId;
  await setDoc(doc(db,'ratings', rateId), {
    id:rateId, subOrderId:subId, parentOrderId:s.parentOrderId, customerId:S.user.uid,
    merchantId:s.merchantId, merchantRating,
    agentId: s.deliveryAgentId||null, agentRating: agentRating||null,
    productRatings, comment, createdAt: nowMs()
  });

  await bumpAverageRating('merchants', s.merchantId, merchantRating);
  for(const pr of productRatings){ await bumpAverageRating('products', pr.productId, pr.rating); }
  if(s.deliveryAgentId && agentRating){ await bumpAverageRating('deliveryAgents', s.deliveryAgentId, agentRating); }

  UI.closeModal();
  UI.toast('شكرًا لتقييمك! 🌟');
};
/* يحدّث متوسط التقييم التراكمي (rating) لأي مستند — تاجر أو منتج أو مندوب — بإضافة تقييم جديد بدون الحاجة لقراءة كل التقييمات السابقة */
async function bumpAverageRating(collectionName, docId, newVal){
  try{
    const ref = doc(db, collectionName, docId);
    const snap = await getDoc(ref);
    if(!snap.exists()) return;
    const cur = snap.data();
    const count = (cur.ratingCount||0) + 1;
    const sum = (cur.ratingSum || (cur.rating||0)*(cur.ratingCount||0)) + newVal;
    const avg = Math.round((sum/count)*10)/10;
    await updateDoc(ref, {ratingCount:count, ratingSum:sum, rating:avg});
  }catch(e){ console.error('bumpAverageRating failed', e); }
}

window.updateSubOrderStatus = async (subId, status, reason=null)=>{
  const s = [...(S.mySubOrders||[]), ...(S.allSubOrders||[]), ...(S.myAgentSubOrders||[])].find(x=>(x._id||x.id)===subId);
  if(!s) return;
  const wasDelivered = s.status==='DELIVERED';
  const extra = {status};
  if(reason){ extra.cancelReason = reason; extra.cancelledAt = nowMs(); }
  await updateDoc(doc(db,'subOrders', s.id), extra);
  const msg = reason ? `للأسف تم إلغاء طلبك رقم #${s.parentOrderId}. السبب: ${reason}` : `طلبك رقم #${s.parentOrderId} الآن: ${ORDER_STATUS[status].label}`;
  await pushNotification('CUSTOMER', s.customerId, 'تحديث حالة طلبك', msg, s.parentOrderId);
  await recomputeOrderStatus(s.parentOrderId);
  // منح نقاط ولاء للعميل عند أول تسليم فعلي فقط (تحقق من الحالة السابقة لمنع منح مضاعف)
  if(status==='DELIVERED' && !wasDelivered && S.settings.loyaltyEnabled!==false){
    const rate = S.settings.loyaltyEarnRate || 0;
    const pointsEarned = Math.floor((s.subtotal||0) * rate);
    if(pointsEarned>0){
      await updateDoc(doc(db,'users', s.customerId), { loyaltyPoints: increment(pointsEarned) });
      await pushNotification('CUSTOMER', s.customerId, 'حصلت على نقاط ولاء 🎁', `أضفنا لك ${pointsEarned} نقطة بعد استلام طلبك رقم #${s.parentOrderId}.`, s.parentOrderId);
    }
  }
  // مكافأة دعوة الصديق: تُمنح لكل من الصديق المُحيل والعميل المُحال عند أول طلب مكتمل للعميل المُحال فقط
  if(status==='DELIVERED' && !wasDelivered){
    try{
      const refSnap = await getDoc(doc(db,'referrals', s.customerId));
      if(refSnap.exists() && refSnap.data().status==='PENDING'){
        const priorDelivered = await getDocs(query(collection(db,'subOrders'), where('customerId','==', s.customerId), where('status','==','DELIVERED')));
        if(priorDelivered.size<=1){ // هذا الطلب هو أول طلب مكتمل للعميل
          const bonus = S.settings.referralBonusPoints || 0;
          const referrerId = refSnap.data().referrerId;
          if(bonus>0){
            await updateDoc(doc(db,'users', s.customerId), { loyaltyPoints: increment(bonus) });
            await updateDoc(doc(db,'users', referrerId), { loyaltyPoints: increment(bonus) });
            await pushNotification('CUSTOMER', s.customerId, 'مكافأة دعوة صديق 🎉', `حصلت على ${bonus} نقطة إضافية بعد أول طلب ليك!`, s.parentOrderId);
            await pushNotification('CUSTOMER', referrerId, 'مكافأة دعوة صديق 🎉', `صديقك اللي دعيته أكمل أول طلب، خدت ${bonus} نقطة! 🎁`, s.parentOrderId);
          }
          await updateDoc(doc(db,'referrals', s.customerId), { status:'REWARDED', rewardedAt: nowMs() });
        }
      }
    }catch(e){ console.error('referral reward check failed', e); }
  }
  UI.toast('تم تحديث حالة الطلب');
};
window.markDelivered = async (subId)=>{ await updateSubOrderStatus(subId,'DELIVERED'); };

window.saveProduct = async (pid)=>{
  const title = document.getElementById('pfTitle').value.trim();
  const price = parseFloat(document.getElementById('pfPrice').value);
  if(!title || !price){ UI.toast('أدخل اسم وسعر المنتج'); return; }
  const oldPrice = parseFloat(document.getElementById('pfOldPrice').value) || null;
  const discountPercent = oldPrice && oldPrice>price ? Math.round(((oldPrice-price)/oldPrice)*100) : 0;
  const data = {
    title, description:document.getElementById('pfDesc').value.trim(),
    categoryId:document.getElementById('pfCat').value, price, oldPrice, discountPercent,
    stock: parseInt(document.getElementById('pfStock').value)||0,
    imageUrl: document.getElementById('pfImg').value.trim() || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'
  };
  if(pid){
    await updateDoc(doc(db,'products',pid), data);
    UI.toast('تم حفظ التعديلات');
  } else {
    const id = 'prod_' + uid();
    await setDoc(doc(db,'products',id), {id, merchantId:S.profile.merchantId, isActive:true, isPopular:false, isNew:true, rating:4.7, ...data});
    UI.toast('تمت إضافة المنتج بنجاح');
  }
  UI.closeModal();
};

/* ================= تقرير أداء التاجر ================= */
function renderMerchantReports(){
  const subs = S.mySubOrders||[];
  if(!subs.length) return emptyState('fa-chart-pie','لا توجد بيانات كافية بعد','التقرير هيظهر أول ما تستقبل طلبات على متجرك');
  const delivered = subs.filter(s=>s.status==='DELIVERED');
  const badTerminal = subs.filter(s=>s.status==='REJECTED'||s.status==='CANCELLED');
  const revenue = delivered.reduce((a,s)=>a+(s.subtotal||0),0);
  const avgOrderValue = delivered.length ? roundMoney(revenue/delivered.length) : 0;
  const cancelRate = subs.length ? roundMoney((badTerminal.length/subs.length)*100) : 0;

  // تجميع الكمية المباعة لكل منتج من الطلبات المكتملة فقط
  const productSales = {};
  delivered.forEach(s=>(s.items||[]).forEach(it=>{
    const key = it.productId;
    productSales[key] = productSales[key] || {title:it.productTitle, qty:0, revenue:0};
    productSales[key].qty += it.quantity;
    productSales[key].revenue += it.price*it.quantity;
  }));
  const topProducts = Object.values(productSales).sort((a,b)=>b.qty-a.qty).slice(0,5);

  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${fmtMoney(revenue)}</div><div class="lbl">إجمالي المبيعات (مكتمل)</div></div>
      <div class="stat-card"><div class="num">${fmtMoney(avgOrderValue)}</div><div class="lbl">متوسط قيمة الطلب</div></div>
      <div class="stat-card"><div class="num">${delivered.length}</div><div class="lbl">طلبات مكتملة</div></div>
      <div class="stat-card"><div class="num" style="color:${cancelRate>15?'var(--danger)':'inherit'}">${cancelRate}%</div><div class="lbl">نسبة الإلغاء/الرفض</div></div>
    </div>
    <div class="section-head"><h3>الأكثر مبيعًا</h3></div>
    ${topProducts.length? `<div class="list-gap">${topProducts.map((p,i)=>`
      <div class="card row-between">
        <div><b style="font-size:13.5px">${i+1}. ${esc(p.title)}</b><div style="font-size:12px;color:var(--ink-soft);margin-top:3px">تم بيع ${p.qty} قطعة</div></div>
        <b style="font-size:13px;color:var(--teal)">${fmtMoney(p.revenue)}</b>
      </div>`).join('')}</div>` : emptyState('fa-box-open','لا توجد طلبات مكتملة بعد','')}
    ${cancelRate>15?`<div class="hint-box" style="border-color:var(--danger);background:var(--danger-tint);color:var(--danger);margin-top:16px"><i class="fa-solid fa-triangle-exclamation"></i> نسبة الإلغاء عندك مرتفعة نسبيًا، حاول تراجع أسباب الإلغاء في تفاصيل الطلبات وتقلل منها.</div>`:''}
  `;
}

window.syncCategories = async ()=>{

window.seedDemoProducts = async ()=>{
  if(!S.categories.length){ UI.toast('حمّل الأقسام أولًا'); return; }
  let merchantId = (S.allMerchants && S.allMerchants[0] && S.allMerchants[0].id) || null;
  const batch = writeBatch(db);
  if(!merchantId){
    merchantId = 'merch_'+uid();
    batch.set(doc(db,'merchants',merchantId), {
      id:merchantId, businessName:'متجر على بابك التجريبي', managerName:'إدارة المنصة',
      phone:'01000000000', whatsappNumber:'01000000000', email:'', activityType:'سوبر ماركت',
      categoryIds:'', address:'القاهرة، مصر', description:'متجر تجريبي لعرض المنتجات على المنصة',
      logoUrl:'', coverUrl:'', status:'ACTIVE', rating:4.8, totalOrdersCount:0,
      ownerId:null, registeredAt:nowMs()
    });
  }
  const existingTitles = new Set(S.products.map(p=>p.categoryId+'|'+p.title));
  let addedCount = 0;
  S.categories.forEach(cat=>{
    const items = DEMO_PRODUCTS_BY_CATEGORY[cat.name];
    if(!items) return;
    items.forEach(([title,desc,price,img])=>{
      if(existingTitles.has(cat.id+'|'+title)) return;
      const id = 'prod_'+uid();
      batch.set(doc(db,'products',id), {
        id, merchantId, categoryId:cat.id, title, description:desc, price, oldPrice:null, discountPercent:0,
        stock:50, imageUrl:img, isActive:true, isPopular:false, isNew:true, rating:4.7
      });
      addedCount++;
    });
  });
  if(!addedCount){ UI.toast('كل المنتجات التجريبية لهذه الأقسام موجودة بالفعل'); return; }
  await batch.commit();
  UI.toast(`تمت إضافة ${addedCount} منتج تجريبي جديد`);
};

function adminSubOrderCard(s){
  const st = ORDER_STATUS[s.status]||{};
  const pillCls = st.color==='success'?'status-active':st.color==='danger'?'status-suspended':'status-pending';
  const canSend = s.status==='PENDING_ADMIN';
  const cancellable = !['DELIVERED','REJECTED','CANCELLED'].includes(s.status);
  return `<div class="card" style="margin-bottom:8px;background:var(--paper)">
    <div class="row-between" style="margin-bottom:6px"><b style="font-size:12.5px"><i class="fa-solid fa-shop" style="color:var(--teal)"></i> ${esc(s.merchantName)}</b><span class="status-pill ${pillCls}" style="font-size:9.5px">${st.label}</span></div>
    ${s.deliveryAgentName?`<p style="font-size:11.5px;color:var(--ink-soft);margin:0 0 6px"><i class="fa-solid fa-motorcycle"></i> مندوب التوصيل: ${esc(s.deliveryAgentName)}</p>`:''}
    ${s.cancelReason?`<p style="font-size:11.5px;color:var(--danger);margin:0 0 6px"><i class="fa-solid fa-circle-info"></i> سبب الإلغاء: ${esc(s.cancelReason)}</p>`:''}
    ${(s.items||[]).map(it=>`<div class="row-between" style="font-size:12px;margin-bottom:3px"><span>${esc(it.productTitle)} × ${it.quantity}</span><span>${fmtMoney(it.price*it.quantity)}</span></div>`).join('')}
    <div class="summary-row total" style="font-size:12.5px"><span>إجمالي التاجر</span><span>${fmtMoney(s.subtotal)}</span></div>
    ${canSend
      ? `<button class="btn btn-primary btn-sm" style="width:100%;margin-top:8px" onclick="adminSendToMerchant('${s._id||s.id}')"><i class="fa-brands fa-whatsapp"></i> إرسال للتاجر عبر واتساب</button>`
      : `<a class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" href="${waLink(s.merchantWhatsapp, 'مرحبًا، بخصوص الطلب رقم #'+s.parentOrderId)}" target="_blank"><i class="fa-brands fa-whatsapp"></i> إعادة تواصل مع التاجر</a>`}
    ${cancellable ? `<button class="btn btn-danger btn-sm" style="width:100%;margin-top:8px" onclick="openCancelSubOrder('${s._id||s.id}','ADMIN')"><i class="fa-solid fa-ban"></i> إلغاء الطلب</button>` : ''}
  </div>`;
}
window.adminSendToMerchant = async (subId)=>{
  const s = S.allSubOrders.find(x=>(x._id||x.id)===subId);
  if(!s) return;
  try{
    const itemsText = (s.items||[]).map((it,i)=>`${i+1}- ${it.productTitle}\nالكمية: ${it.quantity}\nالسعر: ${fmtMoney(it.price*it.quantity)}`).join('\n\n');
    const msg = `مرحبًا من على بابك 👋\n\nلديك طلب جديد:\n\nرقم الطلب: #${s.parentOrderId}\n\nبيانات العميل:\nالاسم: ${s.customerName}\nالهاتف: ${s.customerPhone}\nالعنوان: ${s.deliveryAddress}\n${s.notes?'ملاحظات: '+s.notes+'\n':''}\nالمنتجات:\n\n${itemsText}\n\nإجمالي منتجاتك: ${fmtMoney(s.subtotal)}\n\nيرجى تأكيد استلام الطلب.`;
    window.open(waLink(s.merchantWhatsapp, msg), '_blank');
    await updateDoc(doc(db,'subOrders', s.id), {
      status:'SENT_TO_MERCHANT', merchantContactStatus:'SENT', merchantContactedAt: nowMs(), sentByAdminId: S.user.uid
    });
    // ✅ التاجر يستلم إشعارًا فقط الآن، بعد إرسال الأدمن، وليس عند إنشاء العميل للطلب
    await pushNotification('MERCHANT', s.merchantId, 'لديك طلب جديد من على بابك', `رقم الطلب: #${s.parentOrderId}`, s.parentOrderId);
    await recomputeOrderStatus(s.parentOrderId);
    UI.toast('تم إرسال الطلب للتاجر عبر واتساب');
  }catch(err){
    console.error('adminSendToMerchant failed', err);
    UI.toast('⚠️ فشل إرسال الطلب: ' + (err&&err.message?err.message:err));
  }
};

window.linkMerchantUser = async (merchantId)=>{
  const uidSel = document.getElementById('lmuUser').value;
  if(!uidSel) return;
  try{

    UI.closeModal();
    UI.toast('تم ربط الحساب بالمتجر بنجاح ✅');
  }catch(err){
    console.error('linkMerchantUser failed', err);

window.saveAdminProduct = async (pid)=>{
  const title = document.getElementById('apfTitle').value.trim();
  const price = parseFloat(document.getElementById('apfPrice').value);
  if(!title || !price){ UI.toast('أدخل اسم وسعر المنتج'); return; }
  const oldPrice = parseFloat(document.getElementById('apfOldPrice').value) || null;
  const discountPercent = oldPrice && oldPrice>price ? Math.round(((oldPrice-price)/oldPrice)*100) : 0;
  const data = {
    title, description:document.getElementById('apfDesc').value.trim(),
    categoryId:document.getElementById('apfCat').value, price, oldPrice, discountPercent,
    stock: parseInt(document.getElementById('apfStock').value)||0,
    imageUrl: document.getElementById('apfImg').value.trim() || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'
  };
  if(pid){
    await updateDoc(doc(db,'products',pid), data);
    UI.toast('تم حفظ التعديلات');
  } else {
    const merchantId = document.getElementById('apfMerchant').value;
    if(!merchantId){ UI.toast('اختر التاجر'); return; }
    const id = 'prod_' + uid();
    await setDoc(doc(db,'products',id), {id, merchantId, isActive:true, isPopular:false, isNew:true, rating:4.7, ...data});
    UI.toast('تمت إضافة المنتج بنجاح');
  }
  UI.closeModal();
};

window.saveCoupon = async ()=>{
  if(!isSuperAdmin()){ UI.toast('إنشاء الكوبونات متاح للأدمن الرئيسي فقط'); return; }
  const code = document.getElementById('cpCode').value.trim().toUpperCase();
  const value = parseFloat(document.getElementById('cpValue').value);
  if(!code || !value || value<=0){ UI.toast('أدخل كود الكوبون وقيمة خصم صحيحة'); return; }
  const existing = (S.allCoupons||[]).find(c=>c.code===code);
  if(existing){ UI.toast('يوجد كوبون بنفس الكود بالفعل'); return; }
  const type = document.getElementById('cpType').value;
  if(type==='PERCENT' && value>100){ UI.toast('نسبة الخصم لا يمكن أن تتجاوز 100%'); return; }
  const minOrderAmount = Math.max(0, parseFloat(document.getElementById('cpMinOrder').value)||0);
  const maxUsesRaw = document.getElementById('cpMaxUses').value;
  const maxUses = maxUsesRaw ? Math.max(1, parseInt(maxUsesRaw)) : null;
  const expiryRaw = document.getElementById('cpExpiry').value;
  const expiresAt = expiryRaw ? new Date(expiryRaw+'T23:59:59').getTime() : null;
  await setDoc(doc(db,'coupons',code), {
    code, type, value, minOrderAmount, maxUses, usedCount:0, expiresAt, isActive:true, createdAt: nowMs()
  });
  await logAudit('إنشاء كوبون', code);
  UI.closeModal();
  UI.toast('تم إنشاء الكوبون بنجاح ✅');
};
window.setCouponActive = async (code, isActive)=>{

  UI.toast(isActive?'تم تفعيل الكوبون':'تم إيقاف الكوبون');

window.removeCouponAdmin = async (code)=>{

/* ================= تقارير المنصة الشاملة ================= */
function renderAdminReports(){
  const subs = S.allSubOrders||[];
  const delivered = subs.filter(s=>s.status==='DELIVERED');
  if(!delivered.length) return emptyState('fa-chart-pie','لا توجد بيانات كافية بعد','التقارير هتظهر أول ما تكتمل طلبات على المنصة');
  const revenue = delivered.reduce((a,s)=>a+(s.subtotal||0),0);
  const cancelled = subs.filter(s=>s.status==='REJECTED'||s.status==='CANCELLED').length;

  // مبيعات آخر 7 أيام (حسب تاريخ إنشاء كل SubOrder المكتمل)
  const days = [...Array(7)].map((_,i)=>{
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-(6-i));
    return {start:d.getTime(), end:d.getTime()+86400000, label:d.toLocaleDateString('ar-EG',{weekday:'short'})};
  });
  const dailyTotals = days.map(d=> delivered.filter(s=>s.createdAt>=d.start && s.createdAt<d.end).reduce((a,s)=>a+(s.subtotal||0),0));
  const maxDaily = Math.max(1, ...dailyTotals);

  // أفضل التجار حسب المبيعات
  const byMerchant = {};
  delivered.forEach(s=>{ byMerchant[s.merchantId] = (byMerchant[s.merchantId]||0) + (s.subtotal||0); });
  const topMerchants = Object.entries(byMerchant).map(([mid,total])=>({name:(getMerchant(mid)||{}).businessName||mid, total})).sort((a,b)=>b.total-a.total).slice(0,5);
  const maxMerchant = Math.max(1, ...topMerchants.map(m=>m.total));

  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${fmtMoney(revenue)}</div><div class="lbl">إجمالي المبيعات (مكتمل)</div></div>
      <div class="stat-card"><div class="num">${delivered.length}</div><div class="lbl">طلبات مكتملة</div></div>
      <div class="stat-card"><div class="num">${S.allMerchants.filter(m=>m.status==='ACTIVE').length}</div><div class="lbl">تاجر نشط</div></div>
      <div class="stat-card"><div class="num">${cancelled}</div><div class="lbl">طلبات ملغية/مرفوضة</div></div>
    </div>

    <div class="section-head"><h3>المبيعات آخر 7 أيام</h3></div>
    <div class="card" style="display:flex;align-items:flex-end;gap:8px;height:150px;padding:16px 12px">
      ${days.map((d,i)=>`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
          <div style="font-size:10px;color:var(--ink-soft)">${dailyTotals[i]>0?Math.round(dailyTotals[i]):''}</div>
          <div style="width:100%;background:var(--teal);border-radius:4px 4px 0 0;height:${Math.max(3,(dailyTotals[i]/maxDaily)*90)}px"></div>
          <div style="font-size:10.5px;color:var(--ink-soft)">${d.label}</div>
        </div>`).join('')}
    </div>

    <div class="section-head"><h3>أفضل التجار مبيعًا</h3></div>
    ${topMerchants.length? `<div class="list-gap">${topMerchants.map(m=>`
      <div class="card">
        <div class="row-between" style="margin-bottom:6px"><b style="font-size:12.5px">${esc(m.name)}</b><b style="font-size:12.5px;color:var(--teal)">${fmtMoney(m.total)}</b></div>
        <div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden"><div style="height:100%;width:${(m.total/maxMerchant)*100}%;background:var(--teal)"></div></div>
      </div>`).join('')}</div>` : ''}
  `;
}

/* ================= التسويات الأسبوعية للتجار ================= */
/* بتجمع كل الطلبات الفرعية "المكتملة/DELIVERED" لكل تاجر في أسبوع محاسبي (سبت→جمعة)،
   وتقسمها لنسبتين حسب عمولة المنصة (المخصصة للتاجر أو الافتراضية من الإعدادات):
   - عمولة المنصة
   - صافي مستحق التاجر
   وتسمح للأدمن بتأكيد دفع تسوية أسبوع معيّن، وتُحفظ القيم وقت الدفع حتى لو اتغيّرت النسبة بعدين. */
function renderAdminSettlements(){
  const delivered = (S.allSubOrders||[]).filter(s=>s.status==='DELIVERED');
  if(!delivered.length) return emptyState('fa-sack-dollar','لا توجد تسويات بعد','التسوية بتتحسب بس من الطلبات اللي وصلت للعميل فعلاً (DELIVERED)');

  const byMerchant = {};
  delivered.forEach(s=>{
    const wk = weekKeyOf(s.createdAt);
    byMerchant[s.merchantId] = byMerchant[s.merchantId] || {};
    byMerchant[s.merchantId][wk] = (byMerchant[s.merchantId][wk]||0) + (s.subtotal||0);
  });

  const filterM = S.aSettleMerchantFilter || 'ALL';
  const merchantIds = Object.keys(byMerchant).filter(id=>filterM==='ALL' || id===filterM);
  const settleById = {}; (S.allSettlements||[]).forEach(d=>{ settleById[d.id]=d; });

  return `
    <div class="field" style="margin-bottom:14px">
      <label>فلترة حسب التاجر</label>
      <select onchange="S.aSettleMerchantFilter=this.value;renderMain()">
        <option value="ALL" ${filterM==='ALL'?'selected':''}>كل التجار</option>
        ${S.allMerchants.map(m=>`<option value="${m.id}" ${filterM===m.id?'selected':''}>${esc(m.businessName)}</option>`).join('')}
      </select>
    </div>
    <div class="hint-box" style="margin-bottom:16px"><i class="fa-solid fa-circle-info"></i> الأسبوع المحاسبي يبدأ يوم السبت وينتهي يوم الجمعة. بيتجمع فيه إجمالي مبيعات كل تاجر من الطلبات المكتملة فقط، وتنقسم تلقائيًا لعمولة المنصة وصافي مستحق التاجر حسب النسبة اللي حددتها.</div>
    ${merchantIds.length? merchantIds.map(mid=>{
      const m = S.allMerchants.find(x=>x.id===mid);
      const defaultPct = (m && m.commissionPercent!=null) ? m.commissionPercent : S.settings.platformCommissionPercent;
      const weeks = Object.keys(byMerchant[mid]).sort().reverse();
      return `<div class="card" style="margin-bottom:16px">
        <div class="row-between" style="margin-bottom:12px"><b style="font-size:14.5px"><i class="fa-solid fa-shop" style="color:var(--teal)"></i> ${esc(m?m.businessName:mid)}</b><span class="badge-chip">عمولة حالية ${defaultPct}%</span></div>
        ${weeks.map(wk=>{
          const gross = roundMoney(byMerchant[mid][wk]);
          const sid = mid+'_'+wk;
          const saved = settleById[sid];
          const pct = saved ? saved.commissionPercent : defaultPct;
          const commissionAmount = saved ? saved.commissionAmount : roundMoney(gross*pct/100);
          const net = saved ? saved.netAmount : roundMoney(gross-commissionAmount);
          const paid = !!(saved && saved.paid);
          return `<div style="border:1px solid var(--line);border-radius:var(--radius-m);padding:12px;margin-bottom:10px;background:var(--paper)">
            <div class="row-between" style="margin-bottom:8px"><b style="font-size:12.5px">${weekLabelOf(wk)}</b><span class="status-pill ${paid?'status-active':'status-pending'}" style="font-size:9.5px">${paid?'تم الدفع':'لم تُدفع بعد'}</span></div>
            <div class="summary-row" style="font-size:12.5px;display:flex;justify-content:space-between;margin-bottom:4px"><span>إجمالي مبيعات التاجر</span><span>${fmtMoney(gross)}</span></div>
            <div class="summary-row" style="font-size:12.5px;display:flex;justify-content:space-between;margin-bottom:4px;color:var(--danger)"><span>عمولة المنصة (${pct}%)</span><span>-${fmtMoney(commissionAmount)}</span></div>
            <div class="summary-row total" style="font-size:13.5px;display:flex;justify-content:space-between;font-weight:800;border-top:1px dashed var(--line);padding-top:6px;margin-top:4px"><span>صافي مستحق التاجر</span><span>${fmtMoney(net)}</span></div>
            ${!paid
              ? `<button class="btn btn-primary btn-sm" style="width:100%;margin-top:10px" onclick="markSettlementPaid('${mid}','${wk}',${gross},${pct})"><i class="fa-solid fa-check"></i> تحديد كمدفوعة</button>`
              : `<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px" onclick="unmarkSettlementPaid('${sid}')"><i class="fa-solid fa-rotate-left"></i> تراجع عن الدفع</button>`}
          </div>`;
        }).join('')}
      </div>`;
    }).join('') : emptyState('fa-sack-dollar','لا توجد بيانات لهذا التاجر','')}
  `;
}
window.markSettlementPaid = async (merchantId, wk, gross, pct)=>{
  if(!isSuperAdmin()){ UI.toast('تأكيد المدفوعات متاح للأدمن الرئيسي فقط'); return; }
  const id = merchantId+'_'+wk;
  const commissionAmount = roundMoney(gross*pct/100);
  const netAmount = roundMoney(gross-commissionAmount);
  await setDoc(doc(db,'settlements', id), {
    id, merchantId, weekKey:wk, gross, commissionPercent:pct, commissionAmount, netAmount,
    paid:true, paidAt: nowMs(), paidByAdminId: S.user.uid
  });
  await logAudit('تسجيل تسوية كمدفوعة', `تاجر ${merchantId} — أسبوع ${wk} — صافي ${netAmount}`);
  UI.toast('تم تسجيل تسوية الأسبوع كمدفوعة ✅');
};
window.unmarkSettlementPaid = async (id)=>{
  if(!isSuperAdmin()){ UI.toast('هذا الإجراء متاح للأدمن الرئيسي فقط'); return; }
  await deleteDoc(doc(db,'settlements', id));
  await logAudit('التراجع عن تسوية مدفوعة', id);
  UI.toast('تم التراجع عن حالة الدفع');
};

/* ================= إعدادات المنصة العامة ================= */
function renderAdminSettings(){
  if(!isSuperAdmin()) return `<div class="empty-state"><i class="fa-solid fa-lock"></i><h4>غير مصرّح لك</h4><p>الإعدادات الحساسة متاحة للأدمن الرئيسي فقط.</p></div>`;
  const s = S.settings;
  return `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin:0 0 14px;font-size:15px">إعدادات عامة للمنصة</h3>
      <div class="field"><label>نسبة عمولة المنصة الافتراضية (%)</label><input id="setCommission" type="number" step="0.1" min="0" max="100" value="${s.platformCommissionPercent}"></div>
      <div class="field"><label>رسوم التوصيل لكل تاجر في الطلب (جنيه)</label><input id="setDeliveryFee" type="number" step="1" min="0" value="${s.defaultDeliveryFee}"></div>
      <div class="field"><label>رقم واتساب الدعم الفني</label><input id="setWhatsapp" value="${esc(s.supportWhatsapp||'')}"></div>
      <button class="btn btn-primary" onclick="saveAppSettings()">حفظ الإعدادات</button>
    </div>
    <div class="hint-box"><i class="fa-solid fa-circle-info"></i> نسبة العمولة دي هي الافتراضية اللي بتتطبق على أي تاجر ملوش نسبة مخصصة. لتحديد نسبة مختلفة لتاجر معيّن، ادخل صفحة «التجار» واضغط «تعديل» بجانب العمولة.</div>

    <div class="card" style="margin-top:16px">
      <div class="row-between" style="margin-bottom:14px">
        <h3 style="margin:0;font-size:15px">برنامج نقاط الولاء</h3>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer">
          <input type="checkbox" id="setLoyaltyEnabled" ${s.loyaltyEnabled!==false?'checked':''}> مفعّل
        </label>
      </div>
      <div class="field"><label>معدل الكسب (نقطة لكل 1 جنيه إنفاق)</label><input id="setLoyaltyEarn" type="number" step="0.01" min="0" value="${s.loyaltyEarnRate||0}"></div>
      <div class="field"><label>قيمة النقطة عند الاستبدال (جنيه لكل نقطة)</label><input id="setLoyaltyRedeem" type="number" step="0.01" min="0" value="${s.loyaltyRedeemValue||0}"></div>
      <p style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;line-height:1.7"><i class="fa-solid fa-circle-info"></i> مثال بالإعدادات الحالية: عميل يصرف ${fmtMoney(100)} هياخد ${Math.floor(100*(s.loyaltyEarnRate||0))} نقطة، وكل نقطة تساوي ${fmtMoney(s.loyaltyRedeemValue||0)} عند الاستخدام. النقاط بتتحسب من قيمة الطلب قبل أي خصومات، وبتضاف بعد التسليم الفعلي فقط.</p>
      <button class="btn btn-primary" onclick="saveLoyaltySettings()">حفظ إعدادات النقاط</button>
    </div>

    <div class="card" style="margin-top:16px">
      <h3 style="margin:0 0 14px;font-size:15px">دعوة صديق</h3>
      <div class="field"><label>عدد النقاط اللي ياخدها كل من الصديقين (الداعي والمدعو)</label><input id="setReferralBonus" type="number" step="1" min="0" value="${s.referralBonusPoints||0}"></div>
      <p style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;line-height:1.7"><i class="fa-solid fa-circle-info"></i> كل عميل عنده كود دعوة خاص بيه يقدر يشاركه مع أصحابه. لما صديقه يسجّل بالكود ده ويكمّل أول طلب ليه، الاتنين ياخدوا نفس عدد النقاط دي تلقائيًا.</p>
      <button class="btn btn-primary" onclick="saveReferralSettings()">حفظ</button>
    </div>
  `;
}
window.saveReferralSettings = async ()=>{
  const referralBonusPoints = Math.max(0, parseInt(document.getElementById('setReferralBonus').value)||0);
  await setDoc(doc(db,'settings','app'), {referralBonusPoints}, {merge:true});
  await logAudit('تعديل إعدادات دعوة الصديق', `نقاط المكافأة: ${referralBonusPoints}`);
  UI.toast('تم حفظ إعدادات دعوة الصديق ✅');
};
window.saveLoyaltySettings = async ()=>{
  const loyaltyEnabled = document.getElementById('setLoyaltyEnabled').checked;
  const loyaltyEarnRate = Math.max(0, parseFloat(document.getElementById('setLoyaltyEarn').value)||0);
  const loyaltyRedeemValue = Math.max(0, parseFloat(document.getElementById('setLoyaltyRedeem').value)||0);
  await setDoc(doc(db,'settings','app'), {loyaltyEnabled, loyaltyEarnRate, loyaltyRedeemValue}, {merge:true});
  await logAudit('تعديل إعدادات نقاط الولاء', `مفعّل: ${loyaltyEnabled} — كسب: ${loyaltyEarnRate} — استبدال: ${loyaltyRedeemValue}`);
  UI.toast('تم حفظ إعدادات نقاط الولاء ✅');
};
window.saveAppSettings = async ()=>{
  const platformCommissionPercent = Math.max(0, Math.min(100, parseFloat(document.getElementById('setCommission').value)||0));
  const defaultDeliveryFee = Math.max(0, parseFloat(document.getElementById('setDeliveryFee').value)||0);
  const supportWhatsapp = document.getElementById('setWhatsapp').value.trim();
  await setDoc(doc(db,'settings','app'), {platformCommissionPercent, defaultDeliveryFee, supportWhatsapp}, {merge:true});
  await logAudit('تعديل الإعدادات العامة', `عمولة: ${platformCommissionPercent}% — توصيل: ${defaultDeliveryFee}`);
  UI.toast('تم حفظ الإعدادات بنجاح ✅');
};

function renderAdminUsers(){
  const seg = S.aUserFilter || 'ALL';
  const tabs = [['ALL','الكل'],['CUSTOMER','عملاء'],['MERCHANT','تجار'],['DELIVERY','مناديب'],['ADMIN','إدارة']];
  const list = seg==='ALL' ? S.allUsers : S.allUsers.filter(u=>(u.role||'').toUpperCase()===seg);
  const canManageAdmins = isSuperAdmin();
  const pageSize = S.aUserPageSize || 20;
  const visible = list.slice(0, pageSize);
  return `
    <div class="seg" style="margin-bottom:14px">${tabs.map(([k,l])=>`<button class="${seg===k?'active':''}" onclick="S.aUserFilter='${k}';S.aUserPageSize=20;renderMain()">${l}</button>`).join('')}</div>
    ${list.length? `<div class="list-gap">${visible.map(u=>{
      const roleLabel = u.role==='ADMIN' ? (u.adminRole==='STAFF'?'أدمن مساعد':'أدمن رئيسي') : u.role==='MERCHANT'?'تاجر':u.role==='DELIVERY'?'مندوب توصيل':'عميل';
      return `<div class="card">
        <div class="row-between">
          <div><b style="font-size:13.5px">${esc((u.firstName||'')+' '+(u.lastName||''))}</b>
            <div style="font-size:12px;color:var(--ink-soft)">${esc(u.email||'')} ${u.phone?' · '+esc(u.phone):''}</div>
          </div>
          <span class="badge-chip">${roleLabel}</span>
        </div>
        ${canManageAdmins ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          ${u.role!=='ADMIN' ? `<button class="btn btn-ghost btn-sm" style="width:auto" onclick="promoteToAdmin('${u._id}')"><i class="fa-solid fa-user-shield"></i> ترقية لأدمن مساعد</button>` : ''}
          ${u.role==='ADMIN' && u.adminRole==='STAFF' ? `<button class="btn btn-ghost btn-sm" style="width:auto" onclick="promoteToSuperAdmin('${u._id}')"><i class="fa-solid fa-crown"></i> ترقية لأدمن رئيسي</button>` : ''}
          ${u.role==='ADMIN' && u._id!==S.user.uid ? `<button class="btn btn-danger btn-sm" style="width:auto" onclick="demoteAdmin('${u._id}')"><i class="fa-solid fa-user-minus"></i> إلغاء صلاحية الإدارة</button>` : ''}
        </div>` : ''}
      </div>`;
    }).join('')}</div>` : emptyState('fa-users','لا يوجد أعضاء في هذا التصنيف','')}
    ${list.length>visible.length ? `<button class="btn btn-ghost" style="margin-top:12px" onclick="S.aUserPageSize=(S.aUserPageSize||20)+20;renderMain()">عرض المزيد (${list.length-visible.length} عضو آخر)</button>` : ''}
    ${!canManageAdmins ? `<div class="hint-box" style="margin-top:16px"><i class="fa-solid fa-lock"></i> إدارة صلاحيات الأعضاء متاحة للأدمن الرئيسي فقط.</div>` : ''}
  `;
}
window.promoteToAdmin = async (uid_)=>{
  if(!isSuperAdmin()) return;
  await updateDoc(doc(db,'users',uid_), { role:'ADMIN', adminRole:'STAFF' });
  await logAudit('ترقية عضو لأدمن مساعد', uid_);
  UI.toast('تمت ترقية العضو لأدمن مساعد');
};
window.promoteToSuperAdmin = async (uid_)=>{
  if(!isSuperAdmin()) return;
  await updateDoc(doc(db,'users',uid_), { adminRole:'SUPER' });
  await logAudit('ترقية أدمن مساعد لأدمن رئيسي', uid_);
  UI.toast('تمت الترقية لأدمن رئيسي');
};
window.demoteAdmin = async (uid_)=>{
  if(!isSuperAdmin()) return;
  if(!confirm('إلغاء صلاحية الإدارة عن هذا العضو؟')) return;
  await updateDoc(doc(db,'users',uid_), { role:'CUSTOMER', adminRole: null });
  await logAudit('إلغاء صلاحية أدمن', uid_);
  UI.toast('تم إلغاء صلاحية الإدارة');
};
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.error('SW registration failed', err));
  });
}
</script>
